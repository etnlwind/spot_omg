<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f5f7fa"/>
<text x="45" y="62" font-family="Apple SD Gothic Neo, sans-serif" font-size="34" fill="#152b43">Spot OMG · 전원 결선 회로도</text>
<text x="45" y="100" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">설계안 R1 · 2026-09-12 | DALY 공통 포트 B- / P-형 기준 · 최종 정격 / 실물 단자 확인 필요</text>
<rect x="45" y="130" width="300" height="175" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="63" y="166" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">BAT1 · DXF 3S LiPo</text>
<text x="63" y="202" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">11.1V / 5250mAh</text>
<text x="63" y="231" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">완충 12.6V · 주전원 + / -</text>
<text x="63" y="260" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">밸런스 커넥터 4선</text>
<polyline points="345,180 405,180" fill="none" stroke="#c84335" stroke-width="5"/>
<rect x="405" y="140" width="180" height="90" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="423" y="176" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">F1 주 퓨즈</text>
<text x="423" y="212" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">배터리 가까이</text>
<polyline points="585,180 675,180 765,180" fill="none" stroke="#c84335" stroke-width="5"/>
<circle cx="675" cy="180" r="5" fill="#c84335"/>
<text x="595" y="136" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#c84335">FUSED+</text>
<rect x="765" y="130" width="335" height="210" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="783" y="164" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">K1 · JD1914 12V / 40A</text>
<polyline points="765,180 820,180 930,260" fill="none" stroke="#c84335" stroke-width="4"/>
<circle cx="820" cy="180" r="5" fill="#c84335"/>
<polyline points="930,180 1100,180 1150,180" fill="none" stroke="#c84335" stroke-width="5"/>
<circle cx="930" cy="180" r="5" fill="#c84335"/>
<polyline points="930,260 1030,260" fill="none" stroke="#526577" stroke-width="3"/>
<circle cx="930" cy="260" r="5" fill="#526577"/>
<text x="787" y="214" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#152b43">30 COM</text>
<text x="950" y="214" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#152b43">87 NO</text>
<text x="890" y="297" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#152b43">87a NC · 미사용 / 절연</text>
<text x="793" y="327" font-family="Apple SD Gothic Neo, sans-serif" font-size="17" fill="#526577">도식은 코일 OFF 상태</text>
<rect x="1150" y="130" width="400" height="210" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="1168" y="166" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">PDB-HEX · IN+ / IN-</text>
<text x="1168" y="202" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">IN+ ← 87 : ROBOT+</text>
<text x="1168" y="231" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">IN- ← GND_P (BMS P-)</text>
<text x="1168" y="260" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">주 출력 = 배터리 전압 그대로</text>
<text x="1168" y="289" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">Vx = 5V : 제어보드 전원</text>
<polyline points="345,270 395,270 395,420 440,420" fill="none" stroke="#247ba0" stroke-width="5"/>
<text x="360" y="335" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#247ba0">BAT-</text>
<rect x="440" y="370" width="450" height="140" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="458" y="406" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">DALY · 3S 12V 60A</text>
<text x="458" y="442" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">B- : 배터리 주 음극만 연결</text>
<text x="458" y="471" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">P- : 부하 / 충전기 공통 음극</text>
<polyline points="890,450 1500,450" fill="none" stroke="#152b43" stroke-width="5"/>
<text x="1080" y="435" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" fill="#152b43">GND_P = 보호된 공통 GND</text>
<polyline points="1450,340 1450,450" fill="none" stroke="#152b43" stroke-width="4"/>
<circle cx="1450" cy="450" r="5" fill="#152b43"/>
<polyline points="675,180 675,355 1000,355" fill="none" stroke="#c84335" stroke-width="3"/>
<text x="1010" y="360" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#c84335">→ FUSED+ 분기 (아래 두 회로)</text>
<text x="45" y="556" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#247ba0">아래의 같은 전원 이름은 전기적으로 연결됩니다. BAT-와 GND_P를 외부 배선으로 연결하지 마십시오.</text>
<rect x="45" y="590" width="730" height="225" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="63" y="626" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">충전 분기 · K1 접점 앞에서 분기</text>
<text x="63" y="662" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">FUSED+ ─ F2 충전 분기 퓨즈 ─ DC 잭 +</text>
<text x="63" y="691" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">GND_P ───────────────── DC 잭 -</text>
<text x="63" y="720" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">외장 12.6V / 2A 3S LiPo CC/CV 충전기 → DC 잭</text>
<text x="63" y="749" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">5.5×2.1mm · 중심 극성 확인 후 배선</text>
<text x="63" y="778" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">충전 중 S1 OFF · 2A 충전기로 로봇 운전하지 않음</text>
<rect x="805" y="590" width="745" height="225" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="823" y="626" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">K1 코일 제어 · 작은 스위치에는 코일 전류만</text>
<text x="825" y="668" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#c84335">FUSED+</text>
<polyline points="920,665 950,665" fill="none" stroke="#c84335" stroke-width="3"/>
<rect x="950" y="650" width="45" height="28" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="954" y="699" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" fill="#152b43">F3</text>
<polyline points="995,665 1020,665 1050,646" fill="none" stroke="#c84335" stroke-width="3"/>
<circle cx="1020" cy="665" r="5" fill="#c84335"/>
<polyline points="1060,665 1140,665" fill="none" stroke="#c84335" stroke-width="3"/>
<text x="1010" y="718" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#152b43">S1 로커</text>
<text x="1080" y="649" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" fill="#152b43">86 (+)</text>
<rect x="1140" y="642" width="75" height="46" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="1154" y="670" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#152b43">코일</text>
<polyline points="1215,665 1435,665" fill="none" stroke="#152b43" stroke-width="3"/>
<text x="1230" y="649" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" fill="#152b43">85 (-)</text>
<text x="1440" y="669" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#152b43">GND_P</text>
<polyline points="1125,665 1125,738 1190,738" fill="none" stroke="#c84335" stroke-width="3"/>
<polyline points="1290,738 1330,738 1330,665" fill="none" stroke="#152b43" stroke-width="3"/>
<rect x="1190" y="720" width="100" height="35" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="1204" y="744" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#152b43">D1</text>
<polyline points="1200,720 1200,755" fill="none" stroke="#c84335" stroke-width="3"/>
<text x="823" y="794" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" fill="#526577">D1: 캐소드(띠) → 86, 애노드 → 85 · 내장 여부 확인</text>
<rect x="45" y="850" width="730" height="230" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="63" y="886" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">셀 감지선 · 주전류가 흐르는 선이 아닙니다</text>
<text x="63" y="922" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">B0 → 팩 - / 첫 셀 -</text>
<text x="63" y="951" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">B1 → 셀1 + / 셀2 - 연결점</text>
<text x="63" y="980" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">B2 → 셀2 + / 셀3 - 연결점</text>
<text x="63" y="1009" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">B3 → 팩 + / 세 번째 셀 +</text>
<text x="63" y="1038" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">팩 밸런스 커넥터를 이용 · 선 색 대신 전압 순서 확인</text>
<rect x="805" y="850" width="745" height="230" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="823" y="886" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">PDB 출력 · 서보 / 로직을 분리하여 배선</text>
<text x="823" y="922" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">ROBOT+ / GND_P → 다리별 퓨즈 → 3개 서보 × 4다리</text>
<text x="823" y="951" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">직결은 12.6V 허용 서보만 · 저전압형은 별도 강압 필요</text>
<text x="823" y="980" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">Vx 5V / G → 로직 퓨즈 → STM32 / ESP32</text>
<text x="823" y="1009" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">URT-2 전원은 보드 정격에 맞게 · 서보 전류 통과 금지</text>
<text x="823" y="1038" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">Vbat / Curr 감지선은 ADC 정격·분압 확인 전 연결 보류</text>
<rect x="45" y="1115" width="1505" height="210" fill="white" stroke="#c7d2de" stroke-width="2"/>
<text x="63" y="1151" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" fill="#152b43">결선 조건과 추가 부품</text>
<text x="63" y="1187" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">• F1/F2/F3/다리별/로직 퓨즈 및 홀더, DC 충전 잭, 절연된 전원 분배 하네스가 추가로 필요합니다.</text>
<text x="63" y="1216" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">• 60A BMS가 40A 릴레이·가는 서보 케이블을 보호한다고 가정하지 않습니다. 각 분기에 맞춰 퓨즈를 선정합니다.</text>
<text x="63" y="1245" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">• D1은 외장 코일 역기전력 보호용입니다. 내장 다이오드가 있으면 그 극성을 우선하고 중복 부품은 생략합니다.</text>
<text x="63" y="1274" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">• OFF는 로봇 부하 차단입니다. BMS 자체 대기 전류는 남습니다. 장기 보관은 주전원과 셀 감지선 모두 분리.</text>
<text x="63" y="1303" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" fill="#526577">• 실제 핀 번호 / 배터리 화학계 / 충전 방식 확인 전 제작 확정 도면으로 사용하지 마십시오.</text>
</svg>